[project]
name = "cmra"
version = "0.1.0"
description = "Deterministic structured data extraction from government PDF report tables"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.103.1",
    "google-genai>=2.5.0",
    "openai>=2.37.0",
    "pdfplumber>=0.11.9",
    "pillow>=12.1.1",
    "pydantic>=2.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
]

# Inert: uv does not install scripts for unpackaged projects, so `uv run cmra`
# does not work here (see docs/RUNBOOK.md §9). Kept pointing at the real entry
# point so it becomes correct the moment packaging config is added.
[project.scripts]
cmra = "extraction.main:main"

# The pipeline is a set of standalone scripts rather than an installed package;
# both script directories go on the path so intra-directory imports
# (`from normalize import ...`, `from extract import ...`) resolve under pytest.
[tool.pytest.ini_options]
pythonpath = ["extraction", "pipeline"]
