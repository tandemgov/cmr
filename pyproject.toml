[project]
name = "cmra"
version = "0.1.0"
description = "Deterministic structured data extraction from government PDF report tables"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.103.1",
    "google-genai>=2.5.0",
    "openai>=2.37.0",
    "pdfplumber>=0.11.9",
    "pillow>=12.1.1",
    "pydantic>=2.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
cmra = "main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
